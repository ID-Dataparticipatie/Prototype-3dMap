server {

    listen 80;
    server_name localhost; # Change this to your server's domain or IP address
    # Root directory where your Unity WebGL project is located
    root /webgl;

    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

      location ~* \.wasm.gz$ {
        gzip_static on;
        expires max;
        add_header Cache-Control "public, max-age=31536000";
        add_header Content-Encoding gzip;
        add_header Vary Accept-Encoding;

        types {
            application/wasm;
        }
        default_type application/wasm;
    }

    # Additional gzip compression configuration for Unity WebGL builds
    location ~* \.(gz)$ {
        gzip_static on;
        expires max;
        add_header Cache-Control "public, max-age=31536000";
        add_header Content-Encoding gzip;
        add_header Vary Accept-Encoding;
        add_header CustomW HimWorking22;
    }

}
